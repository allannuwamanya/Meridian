# Cloudflare Pages Configuration for Next.js
# This file is used when deploying to Cloudflare Pages

name = "meridian"

# Pages-specific configuration
[pages]
# Build configuration
build_command = "npm run build"

# Development server
[dev]
ip = "0.0.0.0"
port = 3000

# Environment variables (set these in Cloudflare Pages dashboard)
# GEMINI_API_KEY = "your-gemini-api-key"
# NEXT_PUBLIC_FIREBASE_API_KEY = "your-firebase-api-key"

# Pages build output directory
pages_build_output_dir = ".next/standalone"

# For Cloudflare Workers adapter (alternative approach)
# If using @cloudflare/next-on-pages, uncomment and adjust:
# main = "./.next/server/edge.js"
# compatibility_date = "2024-01-01"
